# Staging copy of examples/knos-meter-batch.yml, started by hand only. It calls attest.yml of the released Knos at the
# v0.3.19 commit, which installs knos 0.3.19 from PyPI. It called a mirror of the 0.3.18 tree's
# attest.yml that installed knos from the staging repository, which is private now.
name: knos meter batch

on:
  workflow_dispatch:
    inputs:
      order:
        description: "The ledger file's path in this repository; add :yyyymm.seq to name one batch (else: the next one the chain has not taken)"
        required: true
        type: string
        default: meter/f1-ledger.jsonl
      kind:
        description: "Whose count: batch (you are the buyer) or claim (you are the seller)"
        required: true
        type: choice
        options: [batch, claim]
        default: batch

permissions: {}

jobs:
  hand:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: drexthealpha/Knos/.github/workflows/attest.yml@155b570edb43788ff275c2e56f2fdb6f7a89f05b # v0.3.19
    with:
      repository: ${{ github.repository }}
      pull: 0
      order: ${{ inputs.order }}
      kind: ${{ inputs.kind }}
